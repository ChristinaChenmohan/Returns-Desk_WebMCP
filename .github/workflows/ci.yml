name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wrangler d1 migrations apply returns-desk --local
      - run: npm run check
      - run: npm run test:e2e
      - run: node scripts/webmcp-headed-smoke.mjs
      - run: node scripts/run-agent-eval.mjs test/eval/traces/ci.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
